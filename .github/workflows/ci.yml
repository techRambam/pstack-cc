name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    # import.sh is the build: it re-derives skills/ and agents/ from the pinned
    # upstream ref and runs every guard (dead rules, overlay drift, forbid gate,
    # lint, hook and cloud-session tests). A non-empty diff afterwards means the
    # committed output was hand-edited or not regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate from upstream and run every guard
        run: ./import.sh
      - name: Committed output matches the generator
        run: git diff --exit-code --stat
      - name: poteto-mode script tests
        working-directory: skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test
